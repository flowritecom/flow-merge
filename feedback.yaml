loops:
  test:
    description: Test the project
    command: pytest tests/lib/{test_flow_merge,test_normalizer}.py tests/lib/normalizer/test_range_at_top_level.py --verbose

  test-normalizer:
    description: Test normalizer of the project
    command: pytest tests/lib/test_normalizer*.py tests/lib/normalizer/*.py --verbose

  test-model:
    description: Test model, file validators and metadata classes
    command: pytest tests/lib/model/*.py tests/lib/model/metadata/*.py --verbose

  test-tokenizer:
    description: Tokenizer classes tests
    command: pytest tests/lib/test_tokenizer.py --verbose

  test-planner:
    description: Planner and resolver tests
    command: pytest tests/lib/planner/*.py --verbose

  test-harness:
    description: Test some more
    script: |
      echo "hello!"
      echo "hello!"
